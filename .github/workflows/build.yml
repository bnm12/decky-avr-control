name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package
        run: |
          mkdir -p out/pioneer-volume
          cp -r dist main.py plugin.json package.json README.md out/pioneer-volume/
          cd out && zip -r ../pioneer-volume.zip pioneer-volume

      - uses: actions/upload-artifact@v4
        with:
          name: pioneer-volume
          path: pioneer-volume.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pioneer-volume.zip
          generate_release_notes: true
